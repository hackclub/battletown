# Game tunables, one top-level key per feature. Read through each feature's own config class
# (hours: Hours::Config; coins and streaks: Game::Config). Tunables only: no per-user data and no secrets.
shared:
  # The hours ledger (app/services/hours/**).
  hours:
    # Where Hours::Sync gets Hackatime time when no source is named: null (nothing) or http (live Hackatime, for
    # users who linked their account at /hackatime). The HOURS_SOURCE environment variable overrides it.
    hours_source: null
    # The most coded time one user can have credited for one local date (anti-abuse). Positive credits are clamped to it.
    daily_cap_seconds: 43200
    # A credit may not be dated further back than this many days before the user's local today (adjustments are exempt).
    max_backfill_days: 3
    # A user counts as active on a date from this many credited seconds (15 minutes).
    active_seconds: 900
    # Hours on local dates before the account's sign-up date (in the user's zone) stay in the ledger but count for
    # nothing in the game: no boss damage, streak day, coins or dashboard time. This many days before the sign-up date
    # count anyway; 0 means the sign-up date itself is the first that counts (fully).
    days_before_signup_counted: 0

  # The coin economy and streaks (app/services/game/**, app/services/coins/**), read through Game::Config.
  coins:
    # Coins credited per APPROVED hour, before any streak bonus. Coins come from approved hours only.
    per_approved_hour: 10

    # Ship deflation (coins only, never boss damage): approved hours of a ship beyond this many since the previous
    # ship convert at the multiplier. 0.8 means 8 coins per hour instead of 10 for the hours past the threshold.
    deflation_after_hours: 6
    deflation_multiplier: 0.8

  streaks:
    # A local day counts for the 15-minute streak (the one that drives the bonus ramp and the freeze) at this many
    # coded minutes, and for the daily-goal streak (a counter for a later weekly merch track: no bonus, no freeze)
    # at goal_minutes. Both are "at least": exactly the minimum counts.
    quick_minutes: 15
    goal_minutes: 60

    # A local day is settled (becomes an immutable daily_results row) this many hours after local midnight, so a
    # late Hackatime sync can still land on it.
    grace_hours: 6

    # The single auto-applied freeze protects the 15-minute streak from its first missed day. After it is used it
    # is re-earned by this many consecutive qualifying days. A new player starts with it available.
    freeze_regen_days: 7
    freeze_starts_available: true

    # Bonus percent on a day's base coins by 15-minute streak day (index 0 is day 1). Day 14 and beyond use the
    # last value. One decimal each. Days 3 to 13 are the straight line from day 2 (7.0) to day 14 (20.0) rounded to
    # one decimal; test/services/game/bonus_ramp_test.rb recomputes them. A missed day resets the streak to 0.
    ramp_percent: [ 5.0, 7.0, 8.1, 9.2, 10.3, 11.3, 12.4, 13.5, 14.6, 15.7, 16.8, 17.8, 18.9, 20.0 ]

  # The weekly boss (app/services/bosses/**).
  boss:
    # Coded seconds in a boss week (all of one's own local dates in it) that earn the "Boss slayer" badge when the boss falls (15 minutes).
    slayer_seconds: 900
    # How many days after a boss ends the card keeps showing it (defeated or escaped) when no newer boss has started.
    afterglow_days: 7

  # The ship flow and staff review (app/services/ships/**), read through Ships::Config.
  ships:
    # The fewest coded hours (since the last ship) a project needs before it can be shipped.
    min_hours: 1.0
    # Staff can lower the approved hours (never raise them) in steps of this many hours.
    approval_step_hours: 0.25
    # Hours coded on a project since its last ship at which Slack nudges it (app/services/notifications/ship_reminders.rb):
    # the first is the ship reminder, the second the MVP nudge. One DM per project per threshold per ship window.
    reminder_hours: [ 5, 10 ]
    # Quick reasons offered to a reviewer when rejecting; free text (up to 300 characters in all) can be added.
    rejection_reasons:
      - The GitHub link does not open, or the repository is private
      - The demo link does not open
      - The description does not say what you built yet
      - The hours do not match what is in the project yet
      - Please add more to the project and ship again

  # Weekly quests (app/services/quests/**), read through Quests::Config. Behind the Flipper flag `quests` (off by default).
  # One admin-set quest per boss week, chosen from a fixed menu of goals the code checks by itself; the flat reward is
  # paid with the person's next approved ship (ledger kind quest_reward), never at completion.
  quests:
    # What the admin form pre-fills, and the most an admin may set. Coins only (1 coin is a small slice of one approved hour).
    default_reward_coins: 15
    max_reward_coins: 40
    # Goals the admin can pick for a new quest. Must be keys of Quests::Goals::KEYS (a quest already made keeps working if a key is removed here).
    allowed_goals: [ code_days, streak_days, ship_project, link_hackatime, add_project ]
    # A quest is still checked this many days after its week ends, so time that syncs late still counts (the ledger accepts hours up to hours.max_backfill_days back).
    evaluate_grace_days: 3
    # Copy and limits for each goal. %{target} is the quest's number, %{minutes} the 15-minute streak bar (streaks.quick_minutes).
    # `unit` words the progress line ("2 of 3 days"); a goal without a target is a single step ("Not yet" / "Done").
    goals:
      code_days:
        title: "Code on %{target} different days"
        description: "Code for at least %{minutes} minutes on %{target} different days this boss week."
        unit: day
        target: { min: 1, max: 7, default: 3 }
      streak_days:
        title: "Code %{target} days in a row"
        description: "Code for at least %{minutes} minutes a day, %{target} days in a row, inside this boss week."
        unit: day
        target: { min: 2, max: 7, default: 3 }
      ship_project:
        title: "Ship a project"
        description: "Send a ship in for review this boss week."
      link_hackatime:
        title: "Link a Hackatime project"
        description: "Link one of your Hackatime projects to a project this boss week."
      add_project:
        title: "Add a project"
        description: "Add a project to Battletown this boss week."

  # The weekly merch track (app/services/merch_track/**), behind the Flipper flag `merch_track`. Hit the daily goal
  # (streaks.goal_minutes) on this many days of a boss week to earn that week's item. No coins are involved; the team
  # arranges delivery with the person on Slack. The items are placeholders until the designer replaces them. No prices
  # belong in this file (a test checks).
  merch_track:
    # Settled daily-goal days (local dates inside the boss's week, from the day the account was created) needed to earn
    # the week's item. A day the freeze covered is not a goal day. 1 to 7.
    days_required: 5
    # Claiming also needs at least one approved ship (ever), on top of identity verification with Hack Club.
    claim_requires_ship: true
    # What a boss week beyond the list below earns: none (no reward) or repeat_last (the last item again).
    after_last_week: none
    # One item per boss week, in order: the first boss earns the first item, and so on. key: lowercase letters, digits
    # and underscores, unique. name: up to 60 characters. description: up to 160. emoji: shown beside the name.
    week_items:
      - key: week_1_sticker
        name: Week 1 sticker
        description: A sticker to celebrate your first goal week.
        emoji: "\U0001F3F7"
      - key: week_2_item
        name: Week 2 reward
        description: Placeholder for the week 2 reward.
        emoji: "\U0001F381"
      - key: week_3_item
        name: Week 3 reward
        description: Placeholder for the week 3 reward.
        emoji: "\U0001F381"
      - key: week_4_item
        name: Week 4 reward
        description: Placeholder for the week 4 reward.
        emoji: "\U0001F3C6"

  # The spending eligibility gate (app/services/eligibility/**), read through Eligibility::Config. Only used while the
  # Flipper flag `eligibility_gate` is on; with it off, spending needs verification only, exactly as before.
  eligibility:
    # How old the copy of the Hack Club Auth verification (users.verification_checked_at, refreshed at every sign-in)
    # may be before spending asks the person to sign in again. Hack Club Auth is never called in between: a real
    # periodic refresh needs an API call that is not built (see docs/CONTRACT.md, "Eligibility gate").
    verification_max_age_days: 30
    # The neutral help sentence shown with the not-eligible note. A placeholder: set it to the real place to ask.
    help_line: Questions? Ask in Slack.

  # The NPS survey ("how likely are you to recommend Battletown?"), behind the Flipper flag `nps`
  # (app/services/nps/**, Notifications::NpsPrompts). Read through Nps::Config.
  nps:
    # Who is asked: someone who counted at least this many coded minutes on at least one of the last `active_days`
    # local days (in their own time zone).
    active_minutes: 15
    active_days: 7
    # At most one Slack message per person in this many days (one prompt window).
    interval_days: 2
    # After someone answers, leave them alone for this many days.
    cooldown_days_after_answer: 14
    # Stop asking after this many prompts in a row without an answer, until they answer or come back after
    # `idle_days_reset` days with no coded day at all.
    max_prompts_without_answer: 3
    idle_days_reset: 14
    # The link in the Slack message works for this many days and for one answer only.
    token_ttl_days: 7
    # Comments (free text from a teen) are emptied after this many days by `bin/rails nps:prune`; scores are kept.
    comment_retention_days: 90

  # The crew ("buddy") bonus (app/services/teams/**), behind the Flipper flag `team`, read through Teams::Config.
  team:
    # The most people in one crew (a crew is 2 or more to earn anything).
    max_size: 5
    # Bonus percent of a day's base coins, paid at ship approval on each coded day that at least one crewmate also coded
    # (at least hours.active_seconds, 15 minutes). One decimal at most. Separate from the streak bonus, never boss damage.
    bonus_percent: 5.0
    # After leaving a crew, this many hours before joining another one.
    leave_cooldown_hours: 24
    # An invite link works for this many hours after it was made or regenerated.
    invite_ttl_hours: 72
    # team:pay_pending only looks at ships approved within this many days.
    pay_pending_days: 3

  # Plinko, the daily toy (app/services/plinko/**, read through Plinko::Config), behind the `plinko` flag. It never
  # awards coins or prizes: balls come from counted coded time and give points, nothing else.
  plinko:
    # One ball for every this many counted coded minutes (counted = the hours ledger from the sign-up date, or from
    # earning_starts_on, whichever is later). The count is cumulative: 7 minutes today and 3 tomorrow make one ball.
    minutes_per_ball: 5
    # The most balls that can wait in the bank at the end of a day. A new ball over the cap pushes out the oldest.
    max_balls_banked: 20
    # A ball can be dropped on the local day it was earned and the days after, until this many days have passed
    # (7 means it is gone on the 7th day after the day it was earned).
    ball_expiry_days: 7
    # Optional launch date (YYYY-MM-DD): coded time before it earns no balls. Leave empty to count from each player's
    # sign-up date (their first counted day).
    earning_starts_on:
    # Rows of pegs. A ball goes left or right with equal chance at every peg, so it lands in one of rows + 1 slots,
    # numbered from 0 on the left. Slot k has chance C(rows, k) / 2^rows: with 8 rows that is
    #   slot:    0    1     2     3     4     5     6     7    8
    #   chance:  0.4% 3.1% 10.9% 21.9% 27.3% 21.9% 10.9% 3.1% 0.4%
    # (the page shows the live table). The server picks the path from a random seed (Plinko::Board.walk); the
    # browser only animates it.
    rows: 8
    # Points for each slot, left to right: rows + 1 numbers, a rare edge slot pays most. A ball always scores
    # something: there is no losing slot. The average ball is worth about 83 points.
    slot_points: [ 560, 200, 100, 70, 50, 70, 100, 200, 560 ]
    # How many nicknames the weekly leaderboard shows (nicknames and points only).
    leaderboard_size: 10
    # Nicknames are "<adjective> <animal> <number from 10 to 99>", drawn at random from these lists, never from a
    # name. A nickname is unique across players (case-insensitive). Keep every word plain and kind.
    nickname_adjectives: [ Brave, Bright, Calm, Clever, Cosmic, Curious, Daring, Dizzy, Eager, Fluffy, Gentle, Glowing, Happy, Jolly, Keen, Lively, Lucky, Mellow, Mighty, Nimble, Plucky, Quick, Quiet, Rapid, Silly, Snappy, Sunny, Swift, Tiny, Witty, Zesty, Zippy ]
    nickname_animals: [ Badger, Beaver, Bison, Camel, Corgi, Crane, Dingo, Dolphin, Falcon, Ferret, Fox, Gecko, Heron, Hedgehog, Ibex, Koala, Lemur, Lynx, Marmot, Newt, Otter, Owl, Panda, Parrot, Penguin, Puffin, Quokka, Raccoon, Seal, Tiger, Turtle, Walrus, Yak ]
