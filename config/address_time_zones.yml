    America/Chihuahua: ["CHH", "CHIH", "Chihuahua"]
    America/Tijuana: ["BCN", "BC", "Baja California"]
    America/Mazatlan: ["BCS", "Baja California Sur", "SIN", "Sinaloa", "SON", "Sonora", "NAY", "Nayarit"]
    America/Cancun: ["ROO", "QROO", "Quintana Roo"]
