    America/Sao_Paulo: ["AL", "Alagoas", "AP", "Amapa", "BA", "Bahia", "CE", "Ceara", "DF", "Distrito Federal", "ES", "Espirito Santo", "GO", "Goias", "MA", "Maranhao", "MG", "Minas Gerais", "PA", "Para", "PB", "Paraiba", "PE", "Pernambuco", "PI", "Piaui", "PR", "Parana", "RJ", "Rio de Janeiro", "RN", "Rio Grande do Norte", "RS", "Rio Grande do Sul", "SC", "Santa Catarina", "SE", "Sergipe", "SP", "Sao Paulo", "TO", "Tocantins"]
    America/Cuiaba: ["MT", "Mato Grosso"]
    America/Campo_Grande: ["MS", "Mato Grosso do Sul"]
    America/Manaus: ["AM", "Amazonas", "RR", "Roraima", "RO", "Rondonia"]
