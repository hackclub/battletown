    America/Winnipeg: ["MB", "Manitoba"]
    America/Regina: ["SK", "Saskatchewan"]
    America/Edmonton: ["AB", "Alberta", "NT", "Northwest Territories"]
    America/Vancouver: ["BC", "British Columbia"]
  AU:
