# Time zone data for AddressTimeZone. Two sections, both keyed by ISO 3166-1 alpha-2 country code. Quote
# every key and entry: unquoted NO / ON / OFF are parsed as booleans by YAML.
#
# This file, not the host's tz database, decides which countries resolve without a region. The tz database
# on a laptop, in Docker and on a CI runner can list different zones per country (zone.tab vs zone1970.tab:
# Germany is Berlin + Busingen in one and Berlin + Zurich in the other, Norway/Sweden/Denmark are all
# "Berlin" in the second), so nothing here depends on those lists.
#
# regions: for countries that span several zones with different rules. Each IANA zone lists the region
# codes and names (matched case-insensitively, ignoring accents and punctuation) that it covers.
#
# principal_zones: for every other country. All the country's zones share the same UTC offsets throughout
# 2026 (Germany with Busingen, Switzerland with Busingen, Norway with Svalbard, Finland with Aland, Italy,
# Argentina's provinces, ...), so the principal zone is correct for every address in it and no region is
# needed. A country that is in neither section (US without a state, RU, NZ, ES, PT, CN, ID, ...) resolves
# to nil and the form falls back to the browser's zone. When a country's zones start to differ, move it
# from principal_zones to regions (or drop it). Where zones tie, the capital or most populous one is used.
#
# Split regions are assigned to the zone covering most of their population. Known inaccuracies:
#   US  Florida panhandle, western Kentucky, eastern Tennessee, Indiana's north-west and south-west
#       counties, El Paso (Texas), western Kansas / Nebraska / the Dakotas, Idaho panhandle, Malheur County
#       (Oregon), the Upper Peninsula of Michigan, and the Navajo Nation (Arizona observes DST there) can be wrong.
#   CA  Nunavut spans three zones, the Ontario / Quebec / BC / Saskatchewan edges differ. Yukon is left out
#       on purpose (it has no matching zone name in the select), so it falls back to the browser zone.
#   BR  Western Para and Tocantins edges; Brazil has had no DST since 2019.
#   MX  Border municipalities use US-style DST; the table follows the state default.
regions:
  US:
    America/New_York: ["CT", "Connecticut", "DE", "Delaware", "DC", "District of Columbia", "Washington DC", "Washington D.C.", "FL", "Florida", "GA", "Georgia", "IN", "Indiana", "KY", "Kentucky", "MA", "Massachusetts", "MD", "Maryland", "ME", "Maine", "MI", "Michigan", "NC", "North Carolina", "NH", "New Hampshire", "NJ", "New Jersey", "NY", "New York", "OH", "Ohio", "PA", "Pennsylvania", "RI", "Rhode Island", "SC", "South Carolina", "VA", "Virginia", "VT", "Vermont", "WV", "West Virginia"]
    America/Chicago: ["AL", "Alabama", "AR", "Arkansas", "IA", "Iowa", "IL", "Illinois", "KS", "Kansas", "LA", "Louisiana", "MN", "Minnesota", "MO", "Missouri", "MS", "Mississippi", "ND", "North Dakota", "NE", "Nebraska", "OK", "Oklahoma", "SD", "South Dakota", "TN", "Tennessee", "TX", "Texas", "WI", "Wisconsin"]
    America/Denver: ["CO", "Colorado", "ID", "Idaho", "MT", "Montana", "NM", "New Mexico", "UT", "Utah", "WY", "Wyoming"]
    America/Phoenix: ["AZ", "Arizona"]
    America/Los_Angeles: ["CA", "California", "NV", "Nevada", "OR", "Oregon", "WA", "Washington"]
    America/Anchorage: ["AK", "Alaska"]
    Pacific/Honolulu: ["HI", "Hawaii"]
