# Tunables for the notification system (app/services/notifications/**). Read through Notifications::Config.
# Nothing is sent unless the environment variable NOTIFICATIONS_ENABLED is exactly "true" (default off).
shared:
  # No Slack DMs between these user-local times (24h "HH:MM"). A reminder due inside the window is moved to the end.
  # Set both to the same value to turn quiet hours off.
  quiet_hours_start: "22:00"
  quiet_hours_end: "07:00"

  # Retries for a failed delivery: attempts are capped (hard maximum 10, enforced by the database) and the wait
  # doubles each time, starting at backoff_base_seconds and never exceeding backoff_max_seconds.
  max_attempts: 5
  backoff_base_seconds: 60
  backoff_max_seconds: 3600

  # A reminder this far past its due time (for example the worker was down) is dropped rather than sent late.
  max_lateness_seconds: 10800

  # Event messages (link question, ship reminders, ship decisions) are dropped, not sent, when they are this far past
  # their due time (default two days), so switching notifications on never sends a pile of old news.
  event_max_lateness_seconds: 172800

  # How long a row stays reserved for a dispatcher while it is being sent (protects against double sends).
  lease_seconds: 300

  # Rows reserved per database round trip.
  batch_size: 25

  # Rows that are no longer pending are deleted by `bin/rails notifications:prune` after this many days.
  retention_days: 90

  # Message copy, built at send time (never stored). PLACEHOLDER: the project owner will edit this.
  # Keep it short and friendly, no prize promises.
  templates:
    daily_reminder: "Hey, it's your Battletown coding time. Open your project and get some time in today. Happy hacking! - the Hack Club Battletown team"
    # Event copy. Placeholders in {braces}: {project} (their project name), {hackatime_project}, {hours}, {coins},
    # {reason} (the reviewer's note, shortened), {unlock_note} (empty, or a sentence for people who cannot spend
    # coins yet: not verified, or not eligible while the eligibility gate is on) and {link} (a page on APP_URL that handles the answer: there are no Slack buttons, the app only has chat:write).
    link_question: "Quick question: is your Hackatime project '{hackatime_project}' part of '{project}'? You can say yes or no on your projects page. If it's a no, we won't ask again: {link} - the Hack Club Battletown team"
    ship_reminder: "Nice work! You've coded {hours} hours on {project} that you haven't shipped yet. Ready to ship it? Whenever you like: {link} - the Hack Club Battletown team"
    ship_mvp: "You're at {hours} hours on {project}. That's a great point to ship a first version and turn those hours into coins. Ship it here when you're ready: {link} - the Hack Club Battletown team"
    ship_approved: "Good news: your ship of {project} was approved for {hours} hours and you earned {coins} coins!{unlock_note} See it here: {link} - the Hack Club Battletown team"
    # Returning-user nudge (feature flag `returning`): one DM per idle period, no guilt and no day counts. {boost_days} is the
    # length of the welcome-back boost (game.yml returning.boost_days); {link} is the dashboard.
    returning_nudge: "Hey, Battletown misses you! The boss is still standing. Code for 15 minutes today and your streak bonus gets a welcome-back boost for {boost_days} days: {link} - the Hack Club Battletown team"
    # nps_prompt (flag `nps`): {link} is a one-click page with a 0 to 10 rating and an optional comment, no login needed.
    nps_prompt: "Quick question: how likely are you to recommend Battletown to a friend? It takes a few seconds and you don't need to log in: {link} - the Hack Club Battletown team"
    # Order status copy (order_shipped, order_fulfilled, order_cancelled, order_refunded): {item} is the item name, {link} the
    # buyer's own order page in the app, {refund_note} is empty or " Your N coins are back." Deliberately NO tracking number or
    # reason: the order page shows what the buyer may see. A hold and a release send nothing.
    order_shipped: "Good news: your order of {item} has shipped! You can see it here: {link} - the Hack Club Battletown team"
    order_fulfilled: "Your order of {item} was handed over. Enjoy it! You can see it here: {link} - the Hack Club Battletown team"
    order_cancelled: "Your order of {item} was cancelled.{refund_note} You can see it here: {link} - the Hack Club Battletown team"
    order_refunded: "Your order of {item} was refunded.{refund_note} You can see it here: {link} - the Hack Club Battletown team"
    ship_rejected: "Thanks for shipping {project}. It needs one more touch before we can approve it: {reason} Fix it up and ship again whenever you're ready: {link} - the Hack Club Battletown team"

  # Email (the second channel; everything here is behind the Flipper flag `email`, and nothing is sent unless
  # NOTIFICATIONS_ENABLED=true and a real SMTP transport is configured: see docs/DEPLOY.md). The sender address is the
  # MAIL_FROM environment variable, never this file. Only the kinds listed under `subjects` are emailed.
  email:
    # Subject lines, built at send time. Placeholders in {braces}: {project} (their project name, shortened).
    subjects:
      ship_approved: "Your {project} ship was approved"
      ship_rejected: "Your {project} ship needs one more touch"
      order_shipped: "Your {item} order has shipped"
      returning_nudge: "The boss is still standing."
    # At most this many emails of the kinds in `capped_kinds` per person in any 7 days (a nudge is cancelled, not
    # delayed, when the person is at the cap). Ship decisions are transactional: they are not capped.
    max_per_week: 2
    capped_kinds:
      - returning_nudge
    # What each email switch is called on /settings/notifications (plain words, the owner can edit these).
    preference_labels:
      ship_approved:
        title: "Email me when a ship is approved"
        hint: "The hours and coins you earned."
      ship_rejected:
        title: "Email me when a ship needs changes"
        hint: "What to fix before you ship again."
      returning_nudge:
        title: "Email me if I've been away for a while"
        hint: "One friendly note, not a stream of them."
      order_shipped:
        title: "Email me when an order ships"
        hint: "A short note with a link to your order."

  # What each switch is called on /settings/notifications (plain words, the owner can edit these).
  preference_labels:
    daily_reminder:
      title: "Daily coding reminder"
      hint: "A nudge at the time you picked, on the days you picked."
    link_question:
      title: "Is this Hackatime project yours?"
      hint: "A question when a Hackatime project looks like one of your projects."
    ship_reminder:
      title: "Ship reminder"
      hint: "A friendly note when a project has some hours you could ship."
    ship_mvp:
      title: "First version nudge"
      hint: "A note when a project has enough hours for a first version."
    ship_approved:
      title: "Ship approved"
      hint: "The hours and coins you earned when a ship is approved."
    ship_rejected:
      title: "Ship needs changes"
      hint: "What to fix when a ship needs a little more work."
    returning_nudge:
      title: "Welcome-back nudge"
      hint: "One friendly note if you have been away a while, about the welcome-back boost."
    nps_prompt:
      title: "Quick survey"
      hint: "A short question every few days about how likely you are to recommend Battletown. One click, comment optional."
    order_shipped:
      title: "Order shipped"
      hint: "A note when the team sends your order. The link shows the details."
    order_fulfilled:
      title: "Order handed over"
      hint: "A note when the team marks your order fulfilled."
    order_cancelled:
      title: "Order cancelled by the team"
      hint: "A note if the team cancels an order for you and your coins come back."
    order_refunded:
      title: "Order refunded"
      hint: "A note if the team refunds an order and your coins come back."
